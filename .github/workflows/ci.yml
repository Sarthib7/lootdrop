name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # postinstall runs `prisma generate`; tests use an in-process Postgres
      # (PGlite), so no database service is required.
      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      - run: pnpm -r lint

      - run: pnpm -r test
